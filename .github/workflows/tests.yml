name: Python tests

on:
  push:
    branches: [main, feature/kafka-streaming-integration]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run deterministic and Spark contract tests
        env:
          SPARK_JARS_REPOSITORIES: https://repo.maven.apache.org/maven2
        run: pytest -q
      - name: Compile Python modules and Airflow DAGs
        run: python -m compileall -q src/streambharat producers dags tests scripts
