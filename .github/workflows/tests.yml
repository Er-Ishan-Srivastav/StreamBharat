name: Python tests

on:
  push:
    branches: [main, feature/kafka-streaming-integration, feature/hybrid-dataset-factory]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Download pinned Delta JARs into the PySpark runtime
        run: |
          python - <<'PY'
          import io
          import time
          import zipfile
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          import pyspark

          mirrors = [
              "https://maven-central.storage-download.googleapis.com/maven2",
              "https://repo1.maven.org/maven2",
              "https://repo.maven.apache.org/maven2",
          ]
          artifacts = [
              "io/delta/delta-spark_2.12/3.2.1/delta-spark_2.12-3.2.1.jar",
              "io/delta/delta-storage/3.2.1/delta-storage-3.2.1.jar",
          ]
          jar_dir = Path(pyspark.__file__).resolve().parent / "jars"
          jar_dir.mkdir(parents=True, exist_ok=True)

          def download_artifact(artifact: str) -> bytes:
              filename = artifact.rsplit("/", 1)[1]
              errors = []
              for mirror in mirrors:
                  url = f"{mirror}/{artifact}"
                  for attempt in range(3):
                      request = Request(
                          url,
                          headers={"User-Agent": "StreamBharat-GitHub-Actions/1.0"},
                      )
                      try:
                          with urlopen(request, timeout=60) as response:
                              payload = response.read()
                          if not zipfile.is_zipfile(io.BytesIO(payload)):
                              raise RuntimeError(f"Downloaded file is not a valid JAR: {url}")
                          print(f"Downloaded {filename} from {mirror}")
                          return payload
                      except HTTPError as exc:
                          errors.append(f"{mirror}: HTTP {exc.code}")
                          if exc.code not in (408, 425, 429, 500, 502, 503, 504):
                              break
                          retry_after = exc.headers.get("Retry-After", "") if exc.headers else ""
                          try:
                              delay = max(1, min(int(retry_after), 60)) if retry_after else 2 ** attempt
                          except ValueError:
                              delay = 2 ** attempt
                      except (URLError, TimeoutError, OSError, RuntimeError) as exc:
                          errors.append(f"{mirror}: {exc}")
                          delay = 2 ** attempt
                      if attempt < 2:
                          print(
                              f"Download attempt {attempt + 1}/3 failed for {filename}: "
                              f"{errors[-1]}; retrying in {delay}s"
                          )
                          time.sleep(delay)
              raise RuntimeError(
                  f"Could not download {filename} from configured Maven mirrors: "
                  + " | ".join(errors)
              )

          for artifact in artifacts:
              filename = artifact.rsplit("/", 1)[1]
              target = jar_dir / filename
              if target.exists() and zipfile.is_zipfile(target):
                  print(f"Using cached {filename} ({target.stat().st_size:,} bytes)")
                  continue
              payload = download_artifact(artifact)
              temporary = target.with_suffix(target.suffix + ".tmp")
              temporary.write_bytes(payload)
              temporary.replace(target)
              print(f"Installed {filename} ({target.stat().st_size:,} bytes)")
          PY
      - name: Run deterministic and Spark contract tests
        env:
          SPARK_USE_PREINSTALLED_JARS: "true"
        run: pytest -q
      - name: Compile Python modules and Airflow DAGs
        run: python -m compileall -q src/streambharat producers dags tests scripts
