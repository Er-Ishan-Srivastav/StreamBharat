services:
  airflow-db:
    image: postgres:16
    container_name: streambharat-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_local_dev}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: streambharat-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_local_dev}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local_streambharat_secret}
      STREAMBHARAT_PROJECT_ROOT: /opt/streambharat
      STREAMBHARAT_DATA_ROOT: /opt/streambharat/data/raw
      PYTHONPATH: /opt/streambharat/src
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYSPARK_PYTHON: python
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_SHUFFLE_PARTITIONS: "8"
      SPARK_EXTRA_PACKAGES: org.postgresql:postgresql:42.7.4
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ottdw
      POSTGRES_USER: ott
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ott_local_dev}
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        (airflow users create --username admin
        --password "${AIRFLOW_ADMIN_PASSWORD:-admin_local_dev}"
        --firstname Stream --lastname Bharat --role Admin
        --email admin@example.local || true)
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/streambharat
      - airflow-logs:/opt/airflow/logs
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: streambharat-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    environment: *airflow-env
    command: webserver
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/streambharat
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: streambharat-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/streambharat
      - airflow-logs:/opt/airflow/logs
    restart: unless-stopped

volumes:
  airflow-db-data:
  airflow-logs:

networks:
  default:
    name: streambharat-network
    external: true
