services:
  airflow-db:
    image: postgres:16
    container_name: streambharat-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: \${AIRFLOW_DB_PASSWORD:-airflow_local_dev}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.4-python3.11
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:\${AIRFLOW_DB_PASSWORD:-airflow_local_dev}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    command: ["bash", "-c", "airflow db migrate && airflow users create --username admin --password \${AIRFLOW_ADMIN_PASSWORD:-admin_local_dev} --firstname Stream --lastname Bharat --role Admin --email admin@example.local || true"]
    volumes:
      - ./dags:/opt/airflow/dags

  airflow-webserver:
    image: apache/airflow:2.10.4-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: webserver
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/streambharat

  airflow-scheduler:
    image: apache/airflow:2.10.4-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/streambharat

volumes:
  airflow-db-data:
