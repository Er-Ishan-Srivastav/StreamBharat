name: Python tests

on:
  push:
    branches: [main, feature/kafka-streaming-integration]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Download pinned Delta JARs into the PySpark runtime
        run: |
          python - <<'PY'
          import io
          import time
          import zipfile
          from pathlib import Path
          from urllib.request import urlopen

          import pyspark

          base = "https://repo.maven.apache.org/maven2"
          artifacts = [
              "io/delta/delta-spark_2.12/3.2.1/delta-spark_2.12-3.2.1.jar",
              "io/delta/delta-storage/3.2.1/delta-storage-3.2.1.jar",
          ]
          jar_dir = Path(pyspark.__file__).resolve().parent / "jars"
          jar_dir.mkdir(parents=True, exist_ok=True)

          for artifact in artifacts:
              filename = artifact.rsplit("/", 1)[1]
              target = jar_dir / filename
              url = f"{base}/{artifact}"
              last_error = None

              for attempt in range(5):
                  try:
                      with urlopen(url, timeout=60) as response:
                          payload = response.read()
                      if not zipfile.is_zipfile(io.BytesIO(payload)):
                          raise RuntimeError(f"Downloaded file is not a valid JAR: {url}")
                      temporary = target.with_suffix(target.suffix + ".tmp")
                      temporary.write_bytes(payload)
                      temporary.replace(target)
                      print(f"Installed {filename} ({target.stat().st_size:,} bytes)")
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt == 4:
                          break
                      delay = 2 ** attempt
                      print(
                          f"Download attempt {attempt + 1} failed for {filename}: "
                          f"{exc}; retrying in {delay}s"
                      )
                      time.sleep(delay)

              if last_error is not None:
                  raise last_error
          PY
      - name: Run deterministic and Spark contract tests
        env:
          SPARK_USE_PREINSTALLED_JARS: "true"
        run: pytest -q
      - name: Compile Python modules and Airflow DAGs
        run: python -m compileall -q src/streambharat producers dags tests scripts
