name: Import complete team workstreams

on:
  push:
    paths:
      - "_bootstrap/*.b64"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct and install project modules
        run: |
          python - <<'PY'
          import base64
          import io
          import lzma
          import pathlib
          import shutil
          import tarfile

          bootstrap = pathlib.Path("_bootstrap")
          parts = sorted(bootstrap.glob("part_*.b64"))
          if len(parts) != 6:
              raise SystemExit(f"Expected six archive chunks, found {len(parts)}")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive = lzma.decompress(base64.b64decode(encoded, validate=True))
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as package:
              members = package.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              package.extractall(".")
          shutil.rmtree(bootstrap)
          pathlib.Path(".github/workflows/import-team-workstreams.yml").unlink()
          PY
      - name: Install lightweight test dependency
        run: python -m pip install "pytest>=8.0"
      - name: Run deterministic tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q src/streambharat tests
      - name: Verify batch orchestration plan
        env:
          PYTHONPATH: src
        run: python -m streambharat.pipeline --dry-run
      - name: Commit imported workstreams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/team-workstreams.md docs/architecture.md docs/delivery-plan.md
          git add src/streambharat tests/test_quality_rules.py scripts/run_q18.sh .github/workflows/tests.yml
          git add -u .github/workflows/import-team-workstreams.yml
          git commit -m "Implement remaining StreamBharat team workstreams"
          git push origin HEAD:main
