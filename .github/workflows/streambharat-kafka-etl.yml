name: StreamBharat Kafka ETL validation

on:
  push:
    branches: [main, feature/kafka-streaming-integration]
    paths:
      - 'src/streambharat/**'
      - 'producers/**'
      - 'tests/**'
      - 'dags/**'
      - 'docker-compose.kafka.yml'
      - 'docker-compose.airflow.yml'
      - 'Dockerfile.spark'
      - 'Dockerfile.airflow'
      - 'sql/**'
      - 'config/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/streambharat-kafka-etl.yml'
  pull_request:
    paths:
      - 'src/streambharat/**'
      - 'producers/**'
      - 'tests/**'
      - 'dags/**'
      - 'docker-compose.kafka.yml'
      - 'docker-compose.airflow.yml'
      - 'Dockerfile.spark'
      - 'Dockerfile.airflow'
      - 'sql/**'
      - 'config/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/streambharat-kafka-etl.yml'
  workflow_dispatch:

jobs:
  spark-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
      SPARK_JARS_PACKAGES: io.delta:delta-spark_2.12:3.2.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kafka,postgres,test]"
          python -m pip install pyyaml
      - name: Compile project and Airflow DAGs
        run: python -m compileall -q src/streambharat producers dags tests scripts
      - name: Validate Compose and project configuration
        run: |
          python - <<'PY'
          import tomllib
          import json
          from pathlib import Path
          import yaml

          for path in ("docker-compose.kafka.yml", "docker-compose.airflow.yml"):
              config = yaml.safe_load(Path(path).read_text())
              assert "services" in config, path
          tomllib.loads(Path("pyproject.toml").read_text())
          assert Path(".env.example").is_file()
          assert Path("sql/001_warehouse.sql").is_file()
          assert Path("sql/003_dashboard_views.sql").is_file()
          assert Path("dags/streambharat_nightly.py").is_file()
          print("Compose, project metadata, warehouse DDL and DAG validation passed")
          PY
      - name: Validate shell entry points and Docker Compose models
        run: |
          bash -n scripts/*.sh config/*.sh
          docker compose -f docker-compose.kafka.yml config --quiet
          docker compose -f docker-compose.airflow.yml config --quiet
      - name: Run Spark contract suite
        run: pytest -q
